name = "furvet"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Secrets (NEVER here; `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID   (sandbox only)
#   DOCTOR_DEMO_USER, DOCTOR_DEMO_PASSWORD
#   PUBLIC_BASE_URL   (https://<worker>.workers.dev; create_deposit refuses without it)
# Local dev: copy .dev.vars.example to .dev.vars (gitignored).

[[d1_databases]]
binding = "DB"
database_name = "furvet"
database_id = "31f6f3eb-370a-4c6f-b467-90d71653d3dc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "furvet-files"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
# The doctor console and the ledger board are served by the Worker (behind HTTP Basic), never as bare static assets.
run_worker_first = ["/console", "/console/*", "/cobros", "/cobros/*", "/cobros.html"]

[vars]
# The app refuses every request unless this is exactly "sandbox" (fail-closed).
PAYPAL_ENV = "sandbox"
CURRENCY = "MXN"
MAX_CHARGE_CENTS = "5000000"
BOT_ENABLED = "true"
SIM_DAILY_MESSAGE_CAP = "300"
CLINIC_NAME = "FurVet demo clinic"
# Rx letterhead. Fictional examples; the real ones go in with `wrangler deploy --var`, never in git.
CLINIC_ADDRESS = "Calle Ejemplo 123, Col. Demo, Ciudad de México"
CLINIC_PHONE = "55 0000 0000"
CLINIC_EMAIL = "contacto@furvet.example"
DOCTOR_DISPLAY_NAME = "MVZ (demo)"
DOCTOR_LICENSE_LABEL = "Cédula profesional: DEMO"
# Clinic subscription (PayPal Subscriptions, sandbox). The plan id is public and comes from
# scripts/paypal-plan.sh; pass it at deploy: `wrangler deploy --var PAYPAL_PLAN_ID:P-…`. Empty ⇒ 503 on /start.
PAYPAL_PLAN_ID = ""
# "Llenar con IA" needs an active subscription. Emergency switch: only the exact text "false" turns the gate off.
SUBSCRIPTION_REQUIRED = "true"
# Audio: 30 min at 32 kbps ≈ 7.2 MB. Daily transcription budget in seconds (free tier ≈ 214 min).
MAX_AUDIO_BYTES = "8000000"
AUDIO_DAILY_SECONDS_CAP = "7200"

[observability]
enabled = true
# Invocation logs record "<METHOD> <URL>"; /r/<token> and /t/<token> must never be logged (V13).
[observability.logs]
invocation_logs = false
