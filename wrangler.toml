name = "furvet"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Secrets (NEVER here; `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID   (sandbox only)
#   DOCTOR_DEMO_USER, DOCTOR_DEMO_PASSWORD
# Local dev: copy .dev.vars.example to .dev.vars (gitignored).

[[d1_databases]]
binding = "DB"
database_name = "furvet"
database_id = "00000000-0000-0000-0000-000000000000" # replaced after `wrangler d1 create furvet`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "furvet-files"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
# The doctor console is served by the Worker (behind HTTP Basic), never as a bare static asset.
run_worker_first = ["/console", "/console/*"]

[vars]
# The app refuses every request unless this is exactly "sandbox" (fail-closed).
PAYPAL_ENV = "sandbox"
CURRENCY = "MXN"
MAX_CHARGE_CENTS = "5000000"
BOT_ENABLED = "true"
SIM_DAILY_MESSAGE_CAP = "300"
CLINIC_NAME = "FurVet demo clinic"
# Audio: 30 min at 32 kbps ≈ 7.2 MB. Daily transcription budget in seconds (free tier ≈ 214 min).
MAX_AUDIO_BYTES = "8000000"
AUDIO_DAILY_SECONDS_CAP = "7200"

[observability]
enabled = true
